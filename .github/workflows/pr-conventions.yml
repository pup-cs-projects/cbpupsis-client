# Checks the convention a squash merge depends on: the PR title becomes the
# commit on its base branch, so it must follow Conventional Commits. Branch
# names and bases follow CONTRIBUTING.md (story -> frNNN -> dev) by agreement,
# not by a check. Releases flow dev -> staging -> main,
# and a merge into staging or main deploys (deploy.yml).
#
# The organization is on the GitHub Free plan with private repositories, so
# branch protection cannot mark these checks as required. They still turn the
# PR red, and the team agreement is that nobody merges a red PR.

name: pr-conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The same list as CONTRIBUTING.md.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >
            The description "{subject}" must start with a lowercase letter and
            must not end with a period. Example: feat(auth): add account lockout
